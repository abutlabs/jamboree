[package]
name = "jamboree"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Launch a local network of any JAM client, watch every node's logs side by side, and break it on purpose"
repository = "https://github.com/jamixir/jamboree"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
portable-pty = "0.8"
tokio = { version = "1.37", features = ["full"] }
anyhow = "1"
strip-ansi-escapes = "0.2"
regex = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "wrap_help"] }
socket2 = { version = "0.6", features = ["all"] }
ansi-to-tui = "4"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
