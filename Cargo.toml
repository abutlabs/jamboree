[package]
name = "jam-ui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Terminal UI for watching the logs of several JAM nodes side by side"
repository = "https://github.com/jamixir/jam-ui"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
portable-pty = "0.8"
tokio = { version = "1.37", features = ["full"] }
anyhow = "1"
regex = "1"
strip-ansi-escapes = "0.2"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
