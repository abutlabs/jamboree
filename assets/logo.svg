    <line x1="160" y1="156" x2="160" y2="192"/>
    <line x1="128" y1="210" x2="96" y2="192"/>
    <line x1="96" y1="192" x2="96" y2="156"/>
    <line x1="96" y1="156" x2="128" y2="138"/>
    <line x1="160" y1="192" x2="153" y2="196" />
    <line x1="135" y1="206" x2="128" y2="210" />
  </g>
  <g fill="#ffffff" stroke="#2b2140" stroke-width="4">
    <circle cx="128" cy="138" r="10"/>
    <circle cx="160" cy="156" r="10"/>
    <circle cx="160" cy="192" r="10"/>
    <circle cx="128" cy="210" r="10"/>
