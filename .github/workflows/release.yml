name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: tar -czf jamboree-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release jamboree
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: jamboree-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # Release notes: this version's section of CHANGELOG.md
      - run: awk '/^## /{n++} n==1 && !/^## /' CHANGELOG.md > notes.md
      - run: gh release create ${{ github.ref_name }} jamboree-*.tar.gz --title ${{ github.ref_name }} --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
